version: "3.9"

services:
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rakuten-mlflow
    working_dir: /app
    volumes:
      - ./:/app
      - ./mlruns:/app/mlruns
    ports:
      - "5000:5000"
    command: mlflow ui --backend-store-uri file:///app/mlruns --host 0.0.0.0 --port 5000

  ingest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rakuten-ingest
    working_dir: /app
    volumes:
      - ./:/app
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    command: python scripts/ingest_script.py

  train:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rakuten-train
    working_dir: /app
    volumes:
      - ./:/app
      - ./artifacts:/app/artifacts
      - ./models:/app/models
      - ./mlruns:/app/mlruns
    depends_on:
      - mlflow
    command: python scripts/train_script.py

  predict:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rakuten-predict
    working_dir: /app
    volumes:
      - ./:/app
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./models:/app/models
      - ./predictions:/app/predictions
    command: python scripts/predict_script.py

  evaluate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rakuten-evaluate
    working_dir: /app
    volumes:
      - ./:/app
      - ./artifacts:/app/artifacts
      - ./models:/app/models
      - ./reports:/app/reports
    command: python scripts/evaluate_script.py

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rakuten-api
    working_dir: /app
    volumes:
      - ./:/app
      - ./artifacts:/app/artifacts
      - ./models:/app/models
    ports:
      - "8000:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000